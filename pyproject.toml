[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "me2-voice-control"
version = "0.1.0"
description = "ME2 Voice Controlled Smart Device - tiny offline voice command model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "librosa",
    "sounddevice",
    "soundfile",
    "pyyaml",
    "onnx",
    "onnxruntime",
]

[project.optional-dependencies]
train = ["torch", "torchaudio"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["src*", "app*", "benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
