# Small two-class wake model. Metrics are clip-disjoint only because all
# supplied positives are one recording source; no multi-speaker claim is made.
labels_config: configs/astra_nova_labels.yaml
model:
  family: dscnn
  features: logmel
  n_mels: 40
  blocks:
    - {ch: 24, k: 5, pool: 2}
    - {ch: 48, k: 5, pool: 2}
    - {ch: 96, k: 5, pool: 2}
  dropout: 0.20
data:
  datasets:
    - {name: astra_nova, path: data/processed/astra_nova}
  split:
    method: official
    val_frac: 0.15
    test_frac: 0.15
    seed: 20261002
    feature_cache: {enabled: true, path: data/cache/astra_nova_logmel}
training:
  seed: 20261002
  epochs: 60
  batch_size: 32
  learning_rate: 0.001
  optimizer: adam
  weight_decay: 0.0001
  early_stopping_patience: 12
  lr_scheduler: cosine
  class_weight: none
  sampling: balanced
  gradient_clip_norm: 5.0
  device: auto
  num_workers: 0
  # Cache deterministic log-Mels locally; use feature masking below rather
  # than waveform augmentation so Mac training stays responsive.
  augmentation: {enabled: false}
  feature_augmentation:
    enabled: true
    p: 0.45
    time_masks: 1
    time_mask_max_frames: 12
    freq_masks: 1
    freq_mask_max_bins: 4
output:
  checkpoint_dir: models/checkpoints
  results_dir: results/astra_nova
  exp_id: ASTRA_NOVA_V1_LOCAL
