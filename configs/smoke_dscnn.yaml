# Smoke-test config: trains the DS-CNN on the synthetic dataset quickly.
# Used to validate the full pipeline (train -> eval -> export -> quantize ->
# benchmark) without downloading a real speech corpus. The resulting model
# only recognizes the synthetic tones, NOT real speech.

model:
  family: dscnn
  features: logmel
  n_mels: 40
  blocks:
    - {ch: 32,  k: 5, pool: 2}
    - {ch: 64,  k: 5, pool: 2}
    - {ch: 128, k: 5, pool: 2}
    - {ch: 128, k: 5, pool: 1}
  dropout: 0.3

data:
  datasets:
    - name: synthetic
      path: data/processed/synthetic
  split:
    method: speaker_disjoint
    val_frac: 0.15
    test_frac: 0.20
    seed: 42

training:
  seed: 42
  epochs: 8
  batch_size: 64
  learning_rate: 0.002
  optimizer: adam
  weight_decay: 0.0001
  early_stopping_patience: 4
  lr_scheduler: cosine
  class_weight: balanced
  device: auto
  num_workers: 0

output:
  checkpoint_dir: models/checkpoints
  results_dir: results
  exp_id: SMOKE_DSCNN
