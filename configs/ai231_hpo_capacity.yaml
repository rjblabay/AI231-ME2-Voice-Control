# Trial A: higher-capacity temporal representation, lighter regularisation.
labels_config: configs/ai231_command_variations.yaml
model:
  family: crnn_bigru
  features: logmel
  n_mels: 40
  conv_channels: [48, 96, 128]
  gru_hidden: 192
  gru_layers: 2
  dropout: 0.20
data:
  datasets: [{name: ai231_commands_v1, path: data/processed/ai231_commands_v1}]
  split: {method: official, seed: 20261016, feature_cache: {enabled: true, path: data/cache/ai231_commands_v1_logmel}}
training:
  seed: 20261017
  epochs: 80
  batch_size: 96
  learning_rate: 0.0008
  optimizer: adam
  weight_decay: 0.0002
  early_stopping_patience: 14
  selection_metric: val_macro_f1
  lr_scheduler: cosine
  class_weight: balanced
  sampling: balanced
  gradient_clip_norm: 5.0
  device: cuda
  num_workers: 6
  augmentation: {enabled: false}
  feature_augmentation: {enabled: true, p: 0.30, time_masks: 2, time_mask_max_frames: 12, freq_masks: 1, freq_mask_max_bins: 4}
output: {checkpoint_dir: models/checkpoints, results_dir: results/commands, exp_id: AI231_HPO_CAPACITY}
