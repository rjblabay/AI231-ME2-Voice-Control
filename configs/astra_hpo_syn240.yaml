labels_config: configs/astra_labels.yaml
model: {family: crnn_bigru, features: logmel, n_mels: 40, conv_channels: [24, 48, 96], gru_hidden: 96, gru_layers: 2, dropout: 0.35}
data:
  datasets: [{name: astra_hpo_syn240, path: data/hpo/astra_syn240}]
  split: {method: official, seed: 20261016, feature_cache: {enabled: true, path: data/cache/astra_wake_v1_logmel}}
training:
  seed: 20261019
  epochs: 80
  batch_size: 64
  learning_rate: 0.0005
  optimizer: adam
  weight_decay: 0.001
  early_stopping_patience: 16
  selection_metric: val_loss
  lr_scheduler: cosine
  class_weight: none
  sampling: balanced
  gradient_clip_norm: 5.0
  device: auto
  num_workers: 4
  augmentation: {enabled: false}
  feature_augmentation: {enabled: true, p: 0.45, time_masks: 2, time_mask_max_frames: 12, freq_masks: 1, freq_mask_max_bins: 4}
output: {checkpoint_dir: models/checkpoints, results_dir: results/astra_hpo, exp_id: HPO_SYN240}
